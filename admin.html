<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15365f"><title>ObedGo Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12233d}.app{max-width:900px;margin:auto;min-height:100vh;background:#fff;padding:22px 16px 48px}.brand{font-size:34px;font-weight:900;color:#15365f}.brand b{color:#f28b30}.sub{color:#6d798b;margin-bottom:20px}.login{max-width:420px;margin:50px auto;border:1px solid #dde4ed;border-radius:18px;padding:20px}.field{width:100%;padding:15px;border:1px solid #d4dce7;border-radius:12px;font-size:18px}.btn{width:100%;border:0;border-radius:12px;padding:15px;background:#15365f;color:#fff;font-size:16px;font-weight:800;margin-top:12px}.error{display:none;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:12px;margin-top:12px}.dash{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.date{font-weight:800;font-size:20px}.refresh{border:0;border-radius:10px;padding:10px 14px;background:#eef3f8;color:#15365f;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card{background:#f7f9fc;border:1px solid #e0e6ef;border-radius:15px;padding:14px}.label{font-size:12px;color:#718096}.value{font-size:25px;font-weight:900;margin-top:4px}.section{font-size:19px;font-weight:900;margin:25px 0 10px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #e0e6ef;border-radius:15px;padding:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.order{border:1px solid #dde4ed;border-radius:15px;padding:14px;margin:10px 0}.order-head{display:flex;justify-content:space-between;gap:10px;font-weight:900}.item{margin-top:10px;padding:10px;background:#f7f9fc;border-radius:10px;font-size:14px;line-height:1.45}.note{margin-top:10px;padding:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;font-weight:700}.muted{color:#758195}.logout{margin-top:25px;background:#eef3f8;color:#15365f}.pdfbtn{background:#15365f;margin-top:18px}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.breakdown{grid-template-columns:1fr}.app{padding:18px 12px 40px}}</style></head><body><main class="app"><div class="brand">Obed<b>Go</b> Admin</div><div class="sub">Denný prehľad objednávok</div><section id="login" class="login"><div style="font-weight:900;font-size:20px;margin-bottom:8px">🔐 Admin prístup</div><div class="muted" style="margin-bottom:14px">Zadaj 6-miestny Admin PIN.</div><input id="pin" class="field" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><button id="loginBtn" class="btn">OTVORIŤ ADMIN</button><div id="loginError" class="error">Nesprávny PIN alebo sa nepodarilo načítať dáta.</div></section><section id="dash" class="dash"><div class="top"><div id="date" class="date"></div><button id="refresh" class="refresh">↻ Obnoviť</button></div><div class="cards"><div class="card"><div class="label">ĽUDIA</div><div id="people" class="value">0</div></div><div class="card"><div class="label">OBEDY</div><div id="meals" class="value">0</div></div><div class="card"><div class="label">SPOLU</div><div id="total" class="value">0 €</div></div><div class="card"><div class="label">ZRUŠENÉ</div><div id="cancelled" class="value">0</div></div></div><div class="section">Platby</div><div class="breakdown"><div class="box"><div class="row"><span>Hotovosť</span><b id="cash">0×</b></div></div><div class="box"><div class="row"><span>Prevod</span><b id="transfer">0×</b></div></div></div><div class="section">Hlavné jedlá</div><div id="mealBreak" class="box"></div><div class="section">Polievky</div><div id="soupBreak" class="box"></div><div class="section">Objednávky podľa osôb</div><div id="orders"></div><button id="pdfReport" class="btn pdfbtn">📄 PDF REPORT</button><button id="logout" class="btn logout">ODHLÁSIŤ ADMIN</button></section></main><script src="config.js"></script><script>
let adminPin='',lastData=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function rpc(pin){const r=await fetch(OBEDGO_CONFIG.supabaseUrl+'/rest/v1/rpc/get_admin_dashboard',{method:'POST',headers:{'Content-Type':'application/json',apikey:OBEDGO_CONFIG.supabaseKey,Authorization:'Bearer '+OBEDGO_CONFIG.supabaseKey},body:JSON.stringify({p_pin:pin,p_date:null})});if(!r.ok)throw Error(await r.text());return r.json()}function rows(d,k){return !d?.length?'<div class="muted">Žiadne údaje.</div>':d.map(x=>`<div class="row"><span>${esc(x[k])}</span><b>${x.count}×</b></div>`).join('')}function render(d){lastData=d;$('date').textContent='📅 '+d.date;$('people').textContent=d.people;$('meals').textContent=d.meals;$('total').textContent=Number(d.total_amount).toFixed(2).replace('.',',')+' €';$('cancelled').textContent=d.cancelled_orders;$('cash').textContent=d.cash_meals+'×';$('transfer').textContent=d.transfer_meals+'×';$('mealBreak').innerHTML=rows(d.meal_breakdown,'meal');$('soupBreak').innerHTML=rows(d.soup_breakdown,'soup');$('orders').innerHTML=d.orders?.length?d.orders.map(o=>`<div class="order"><div class="order-head"><span>${esc(o.employee_name)}</span><span>${o.meal_count}× · ${Number(o.total).toFixed(2).replace('.',',')} €</span></div><div class="muted" style="margin-top:4px">${esc(o.payment_method)}</div>${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}${(o.items||[]).map((it,i)=>`<div class="item"><b>Obed ${i+1}</b><br>🥣 ${esc(it.soup)}<br>🍽️ ${esc(it.meal)}</div>`).join('')}</div>`).join(''):'<div class="muted">Dnes zatiaľ nie sú žiadne aktívne objednávky.</div>'}async function load(){$('refresh').disabled=true;try{render(await rpc(adminPin));$('login').style.display='none';$('dash').style.display='block';$('loginError').style.display='none'}catch(e){$('loginError').style.display='block';console.error(e)}finally{$('refresh').disabled=false}}
function pdfReport(){if(!lastData)return alert('Najprv načítaj dnešné objednávky.');const d=lastData;const meals=(d.meal_breakdown||[]).map(x=>`<tr><td>${esc(x.meal)}</td><td>${x.count}×</td></tr>`).join('');const soups=(d.soup_breakdown||[]).map(x=>`<tr><td>${esc(x.soup)}</td><td>${x.count}×</td></tr>`).join('');const orders=(d.orders||[]).map(o=>`<div class="order"><b>${esc(o.employee_name)}</b> — ${o.meal_count}× — ${esc(o.payment_method)}${o.note?`<div class="note">Poznámka: ${esc(o.note)}</div>`:''}${(o.items||[]).map((it,i)=>`<div>${i+1}. ${esc(it.soup)} | ${esc(it.meal)}</div>`).join('')}</div>`).join('');const html=`<!doctype html><html><head><meta charset="utf-8"><title>ObedGo report ${esc(d.date)}</title><style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;color:#12233d;font-size:11px}h1{font-size:24px;color:#15365f;margin:0}h1 b{color:#f28b30}h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #15365f;padding-bottom:4px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.card{border:1px solid #ccd5e0;border-radius:6px;padding:8px}.card small{display:block;color:#68758a}.card strong{font-size:17px}table{width:100%;border-collapse:collapse}td{padding:5px;border-bottom:1px solid #ddd}td:last-child{text-align:right;font-weight:bold}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.order{padding:7px 0;border-bottom:1px solid #ddd;line-height:1.5;break-inside:avoid}.note{font-weight:bold;margin:3px 0}.foot{margin-top:15px;color:#68758a;font-size:9px}@media print{.noprint{display:none}}</style></head><body><h1>Obed<b>Go</b> — denný report</h1><div>${esc(d.date)} · 4M Restaurant</div><div class="summary"><div class="card"><small>ĽUDIA</small><strong>${d.people}</strong></div><div class="card"><small>OBEDY</small><strong>${d.meals}</strong></div><div class="card"><small>SPOLU</small><strong>${Number(d.total_amount).toFixed(2).replace('.',',')} €</strong></div><div class="card"><small>ZRUŠENÉ</small><strong>${d.cancelled_orders}</strong></div></div><div class="cols"><div><h2>Polievky</h2><table>${soups}</table></div><div><h2>Hlavné jedlá</h2><table>${meals}</table></div></div><h2>Platby</h2><table><tr><td>Hotovosť</td><td>${d.cash_meals}×</td></tr><tr><td>Prevod na účet</td><td>${d.transfer_meals}×</td></tr></table><h2>Objednávky podľa osôb</h2>${orders}<div class="foot">ObedGo · report vytvorený z Admin prehľadu po uzávierke objednávok.</div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`;const w=window.open('','_blank');if(!w)return alert('Prehliadač zablokoval otvorenie reportu. Povoľ vyskakovacie okná pre ObedGo.');w.document.open();w.document.write(html);w.document.close()}
$('loginBtn').onclick=()=>{adminPin=$('pin').value.trim();if(adminPin.length!==6)return $('loginError').style.display='block';load()};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('refresh').onclick=load;$('pdfReport').onclick=pdfReport;$('logout').onclick=()=>{adminPin='';lastData=null;$('pin').value='';$('dash').style.display='none';$('login').style.display='block'};</script></body></html>
