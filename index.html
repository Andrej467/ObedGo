<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15365f">
<title>ObedGo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12233d}.app{max-width:640px;margin:auto;min-height:100vh;background:#fff;padding:22px 16px 42px}.brand{font-size:36px;font-weight:900;letter-spacing:-1.5px;color:#15365f}.brand b{color:#f28b30}.tag{color:#68758a;margin:0 0 18px}.hero{background:linear-gradient(135deg,#15365f,#204f87);color:#fff;border-radius:18px;padding:18px;margin-bottom:18px}.hero .date{font-size:21px;font-weight:800}.hero .restaurant{font-size:15px;opacity:.88;margin-top:4px}.section{font-size:18px;font-weight:850;margin:24px 0 10px}.hint{font-size:13px;color:#748196;margin-top:-5px;margin-bottom:10px}.field{width:100%;padding:14px 15px;border:1px solid #d6dce5;border-radius:13px;font-size:16px}.meal-card{border:1px solid #dce4ef;border-radius:16px;padding:14px;margin:12px 0;background:#fbfcfe}.meal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.meal-title{font-weight:900}.remove{border:0;background:#fff1f2;color:#b42318;border-radius:10px;padding:8px 10px;font-weight:700}.option{display:block;border:2px solid #e5e9f0;border-radius:14px;padding:12px;margin:8px 0;background:#fff}.option:has(input:checked){border-color:#204f87;background:#f2f7fd}.option input{margin-right:10px;accent-color:#204f87}.title{font-weight:800}.desc{display:block;font-size:14px;line-height:1.38;margin:5px 0 0 28px;color:#35445a}.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{border:1px solid #dce4ef;border-radius:16px;padding:14px;margin-top:18px;background:#f8fafc}.summary strong{font-size:21px}.button{width:100%;border:0;border-radius:14px;background:#15365f;color:#fff;padding:17px;font-size:17px;font-weight:900;margin-top:18px}.button.secondary{background:#eef3f8;color:#15365f}.button.danger{background:#b42318}.button:disabled{opacity:.6}.success,.error,.info{display:none;padding:16px;border-radius:14px;margin-top:15px}.success{background:#ecfdf3;border:1px solid #9fe2b7}.error{background:#fef2f2;border:1px solid #fecaca}.info{background:#eff6ff;border:1px solid #bfdbfe}.notice{font-size:12px;color:#78869a;text-align:center;margin-top:16px;line-height:1.4}.status{display:none;border:1px solid #dce4ef;border-radius:16px;padding:14px;margin:16px 0;background:#fff}
</style>
</head>
<body>
<main class="app">
<div class="brand">Obed<b>Go</b></div>
<div class="tag">Obed na pár kliknutí.</div>
<div class="hero"><div class="date">Načítavam dnešné menu…</div><div class="restaurant">4M Restaurant · Trenčín</div></div>
<div id="status" class="status"></div>
<div class="section">Tvoje meno</div><input class="field" id="name" placeholder="Meno a priezvisko" autocomplete="name">
<div class="section">Tvoje obedy</div><div class="hint">Môžeš objednať viac obedov. Každý obed môže mať inú polievku a menu.</div>
<div id="items"></div>
<button class="button secondary" id="add">+ PRIDAŤ ĎALŠÍ OBED</button>
<div class="section">💳 Spôsob platby</div>
<div class="pay"><label class="option"><input type="radio" name="pay" value="Hotovosť"><span class="title">Hotovosť</span></label><label class="option"><input type="radio" name="pay" value="Prevod"><span class="title">Prevod na účet</span></label></div>
<div class="summary"><span class="hint">Súhrn objednávky</span><br><strong id="summary">1 obed · 6,20 €</strong></div>
<button class="button" id="save">ULOŽIŤ OBJEDNÁVKU</button>
<button class="button danger" id="cancel" style="display:none">ZRUŠIŤ OBJEDNÁVKU</button>
<div class="success" id="success"></div><div class="error" id="error"></div><div class="info" id="info"></div>
<div class="notice">Objednávku môžeš upraviť alebo zrušiť do 09:00. Potom sa uzamkne.</div>
</main>
<script src="config.js"></script>
<script>
const PRICE=6.20;
let SOUPS=[];
let MEALS=[];
function bratislavaDate(){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bratislava',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));
 return `${o.year}-${o.month}-${o.day}`;
}
function prettyDate(iso,weekday){const [y,m,d]=iso.split('-').map(Number);return `${weekday} ${d}. ${m}. ${y}`}
async function loadDailyMenu(){
 const today=bratislavaDate();
 const r=await fetch(`${OBEDGO_CONFIG.supabaseUrl}/rest/v1/daily_menu?menu_date=eq.${today}&select=menu_date,restaurant,weekday,soup_1,soup_2,meals`,{headers:{'apikey':OBEDGO_CONFIG.supabaseKey,'Authorization':'Bearer '+OBEDGO_CONFIG.supabaseKey}});
 if(!r.ok)throw new Error(await r.text());
 const rows=await r.json(); if(!rows.length)throw new Error('NO_MENU');
 const d=rows[0]; SOUPS=[d.soup_1,d.soup_2]; MEALS=Array.isArray(d.meals)?d.meals:[];
 document.querySelector('.hero .date').textContent=prettyDate(d.menu_date,d.weekday);
 document.querySelector('.hero .restaurant').textContent=(d.restaurant||'4M Restaurant')+' · Trenčín';
}
const itemsEl=document.getElementById('items'),nameEl=document.getElementById('name'),summaryEl=document.getElementById('summary'),saveBtn=document.getElementById('save'),cancelBtn=document.getElementById('cancel'),successEl=document.getElementById('success'),errorEl=document.getElementById('error'),infoEl=document.getElementById('info'),statusEl=document.getElementById('status');
let clientToken=localStorage.getItem('obedgo-client-token'); if(!clientToken){clientToken=crypto.randomUUID();localStorage.setItem('obedgo-client-token',clientToken)}
nameEl.value=localStorage.getItem('obedgo-name')||'';

function mealCard(index,data={}){
 const div=document.createElement('div');div.className='meal-card';div.dataset.index=index;
 div.innerHTML=`<div class="meal-head"><div class="meal-title">Obed ${index+1}</div>${index>0?'<button class="remove" type="button">Odstrániť</button>':''}</div>
 <div class="hint" style="margin-top:10px">Polievka</div>
 ${SOUPS.map(s=>`<label class="option"><input type="radio" name="soup-${index}" value="${s}" ${data.soup===s?'checked':''}><span class="title">${s}</span></label>`).join('')}
 <div class="hint" style="margin-top:12px">Hlavné jedlo</div>
 ${MEALS.map(m=>{const p=m.split(' – ');return `<label class="option"><input type="radio" name="meal-${index}" value="${m}" ${data.meal===m?'checked':''}><span class="title">${p[0]}</span><span class="desc">${p.slice(1).join(' – ')}</span></label>`}).join('')}`;
 const rem=div.querySelector('.remove');if(rem)rem.onclick=()=>{div.remove();renumber();updateSummary()};
 return div
}
function renumber(){[...itemsEl.children].forEach((c,i)=>{c.dataset.index=i;c.querySelector('.meal-title').textContent='Obed '+(i+1);c.querySelectorAll('input').forEach(inp=>{if(inp.name.startsWith('soup-'))inp.name='soup-'+i;if(inp.name.startsWith('meal-'))inp.name='meal-'+i})})}
function updateSummary(){const n=itemsEl.children.length;summaryEl.textContent=`${n} ${n===1?'obed':n<5?'obedy':'obedov'} · ${(n*PRICE).toFixed(2).replace('.',',')} €`}
function addItem(data={}){if(itemsEl.children.length>=10){alert('Maximálne 10 obedov.');return}itemsEl.appendChild(mealCard(itemsEl.children.length,data));updateSummary()}
function collectItems(){const out=[];for(const [i,c] of [...itemsEl.children].entries()){const s=c.querySelector(`input[name="soup-${i}"]:checked`),m=c.querySelector(`input[name="meal-${i}"]:checked`);if(!s||!m)return null;out.push({soup:s.value,meal:m.value})}return out}
async function rpc(fn,body){const r=await fetch(`${OBEDGO_CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':OBEDGO_CONFIG.supabaseKey,'Authorization':'Bearer '+OBEDGO_CONFIG.supabaseKey},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return await r.json()}
async function loadExisting(){try{const d=await rpc('get_my_order',{p_client_token:clientToken});if(!d)return;statusEl.style.display='block';if(d.status==='cancelled'){statusEl.innerHTML='<b>Dnešná objednávka je zrušená.</b>';return}statusEl.innerHTML=`<b>Moja dnešná objednávka</b><br>${d.meal_count} obed(y) · ${Number(d.total).toFixed(2).replace('.',',')} €<br>${d.editable?'Môžeš ju upraviť do 09:00.':'Objednávka je uzamknutá.'}`;nameEl.value=d.employee_name||nameEl.value;localStorage.setItem('obedgo-name',nameEl.value);document.querySelector(`input[name="pay"][value="${d.payment_method}"]`)?.click();itemsEl.innerHTML='';(d.items||[]).forEach(it=>addItem(it));if(!d.editable){saveBtn.disabled=true;saveBtn.textContent='OBJEDNÁVKA UZAMKNUTÁ';cancelBtn.style.display='none';document.querySelectorAll('input,#add,.remove').forEach(el=>el.disabled=true)}else{cancelBtn.style.display='block';saveBtn.textContent='ULOŽIŤ ZMENY'}}catch(e){console.error(e)}}
document.getElementById('add').onclick=()=>addItem();
saveBtn.onclick=async()=>{successEl.style.display=errorEl.style.display=infoEl.style.display='none';const name=nameEl.value.trim(),pay=document.querySelector('input[name="pay"]:checked'),items=collectItems();if(!name||!pay||!items){alert('Vyplň meno, všetky polievky, všetky menu a platbu.');return}saveBtn.disabled=true;saveBtn.textContent='UKLADÁM...';try{localStorage.setItem('obedgo-name',name);const d=await rpc('save_my_order',{p_client_token:clientToken,p_employee_name:name,p_payment_method:pay.value,p_items:items,p_restaurant:'4M Restaurant'});successEl.style.display='block';successEl.innerHTML=`<b>Objednávka uložená ✓</b><br>${d.meal_count} obed(y) · ${Number(d.total).toFixed(2).replace('.',',')} €`;cancelBtn.style.display='block';saveBtn.textContent='ULOŽIŤ ZMENY';statusEl.style.display='block';statusEl.innerHTML='<b>Moja dnešná objednávka</b><br>Môžeš ju upraviť alebo zrušiť do 09:00.'}catch(e){errorEl.style.display='block';errorEl.textContent='Objednávku sa nepodarilo uložiť. Ak je po 09:00, objednávanie je uzavreté.';console.error(e)}finally{saveBtn.disabled=false}};
cancelBtn.onclick=async()=>{if(!confirm('Naozaj chceš zrušiť dnešnú objednávku?'))return;cancelBtn.disabled=true;try{await rpc('cancel_my_order',{p_client_token:clientToken});infoEl.style.display='block';infoEl.innerHTML='<b>Objednávka bola zrušená.</b>';statusEl.style.display='block';statusEl.innerHTML='<b>Dnešná objednávka je zrušená.</b>';cancelBtn.style.display='none';saveBtn.textContent='OBJEDNAŤ ZNOVA'}catch(e){errorEl.style.display='block';errorEl.textContent='Objednávku sa nepodarilo zrušiť. Ak je po 09:00, už ju nemožno meniť.';console.error(e)}finally{cancelBtn.disabled=false}};
async function startApp(){
 try{await loadDailyMenu();addItem();await loadExisting()}
 catch(e){console.error(e);document.getElementById('add').disabled=true;saveBtn.disabled=true;saveBtn.textContent='MENU NIE JE DOSTUPNÉ';statusEl.style.display='block';statusEl.innerHTML='<b>Aktuálne menu ešte nie je dostupné.</b><br>Skús ObedGo otvoriť neskôr.'}
}
startApp();
</script>
</body>
</html>
