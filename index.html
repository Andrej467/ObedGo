<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15365f"><title>ObedGo</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12233d}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;padding:22px 16px 42px}.brand{font-size:36px;font-weight:900;letter-spacing:-1.5px;color:#15365f}.brand b{color:#f28b30}.tag{color:#68758a;margin:0 0 18px}.hero{background:linear-gradient(135deg,#15365f,#204f87);color:#fff;border-radius:18px;padding:18px;margin-bottom:18px}.hero .date{font-size:21px;font-weight:800}.hero .restaurant{font-size:15px;opacity:.88;margin-top:4px}.section{font-size:18px;font-weight:850;margin:24px 0 10px}.hint{font-size:13px;color:#748196;margin-top:-5px;margin-bottom:10px}.field{width:100%;padding:14px 15px;border:1px solid #d6dce5;border-radius:13px;font-size:16px}.option{display:block;border:2px solid #e5e9f0;border-radius:15px;padding:14px;margin:9px 0;cursor:pointer;background:#fff}.option:has(input:checked){border-color:#204f87;background:#f2f7fd}.option input{margin-right:10px;accent-color:#204f87}.title{font-weight:800}.desc{display:block;font-size:14px;line-height:1.38;margin:5px 0 0 28px;color:#35445a}.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{border:1px solid #dce4ef;border-radius:16px;padding:14px;margin-top:18px;background:#f8fafc}.summary strong{font-size:21px}.button{width:100%;border:0;border-radius:14px;background:#15365f;color:#fff;padding:17px;font-size:17px;font-weight:900;margin-top:18px}.button:disabled{opacity:.6}.success,.error{display:none;padding:16px;border-radius:14px;margin-top:15px}.success{background:#ecfdf3;border:1px solid #9fe2b7}.error{background:#fef2f2;border:1px solid #fecaca}.notice{font-size:12px;color:#78869a;text-align:center;margin-top:16px;line-height:1.4}</style></head><body><main class="app"><div class="brand">Obed<b>Go</b></div><div class="tag">Obed na pár kliknutí.</div><div class="hero"><div class="date">Štvrtok 13. 8. 2026</div><div class="restaurant">4M Restaurant · Trenčín</div></div><div class="section">Tvoje meno</div><input class="field" id="name" placeholder="Meno a priezvisko" autocomplete="name"><div class="section">🥣 Polievka</div><div class="hint">Vyber jednu polievku</div><label class="option"><input type="radio" name="soup" value="Hubová kyslá so zemiakmi"><span class="title">Hubová kyslá so zemiakmi</span></label><label class="option"><input type="radio" name="soup" value="Karfiolová číra s hráškom a pórkom"><span class="title">Karfiolová číra s hráškom a pórkom</span></label><div class="section">🍽️ Hlavné jedlo</div><div class="hint">Vyber jedno menu</div><label class="option"><input type="radio" name="meal" value="MENU 1 – Zemiaková placka plnená jemne pikantným kuracím soté, strúhaný syr, ryža, hranolky"><span class="title">MENU 1</span><span class="desc">Zemiaková placka plnená jemne pikantným kuracím soté, strúhaný syr, ryža, hranolky</span></label><label class="option"><input type="radio" name="meal" value="MENU 2 – Grilovaná bravčová panenka, parená brokolica na masle s parmezánom, mäsovo-slivková omáčka, dusená ryža"><span class="title">MENU 2</span><span class="desc">Grilovaná bravčová panenka, parená brokolica na masle s parmezánom, mäsovo-slivková omáčka, dusená ryža</span></label><label class="option"><input type="radio" name="meal" value="MENU 3 – Spaghetti alla Toscana – rajčiny, mascarpone, prosciutto, olivy, cuketa, baklažán, strúhaný syr"><span class="title">MENU 3</span><span class="desc">Spaghetti alla Toscana – rajčiny, mascarpone, prosciutto, olivy, cuketa, baklažán, strúhaný syr</span></label><div class="section">💳 Spôsob platby</div><div class="pay"><label class="option"><input type="radio" name="pay" value="Hotovosť"><span class="title">Hotovosť</span></label><label class="option"><input type="radio" name="pay" value="Prevod"><span class="title">Prevod na účet</span></label></div><div class="summary"><span class="hint">Cena obeda</span><br><strong>6,20 €</strong></div><button class="button" id="order">OBJEDNAŤ OBED</button><div class="success" id="success"></div><div class="error" id="error"></div><div class="notice">Po odoslaní sa objednávka uloží do spoločného zoznamu ObedGo.</div></main><script src="config.js"></script><script>const nameEl=document.getElementById('name');nameEl.value=localStorage.getItem('obedgo-name')||'';document.getElementById('order').onclick=async()=>{const btn=document.getElementById('order'),ok=document.getElementById('success'),err=document.getElementById('error');ok.style.display='none';err.style.display='none';const name=nameEl.value.trim(),s=document.querySelector('input[name=soup]:checked'),m=document.querySelector('input[name=meal]:checked'),p=document.querySelector('input[name=pay]:checked');if(!name||!s||!m||!p){alert('Vyplň meno, polievku, menu a spôsob platby.');return}btn.disabled=true;btn.textContent='ODOSIELAM...';localStorage.setItem('obedgo-name',name);const payload={employee_name:name,restaurant:'4M Restaurant',soup:s.value,meal:m.value,price:6.20,payment_method:p.value,order_date:'2026-08-13'};try{const r=await fetch(OBEDGO_CONFIG.supabaseUrl+'/rest/v1/orders',{method:'POST',headers:{'Content-Type':'application/json','apikey':OBEDGO_CONFIG.supabaseKey,'Authorization':'Bearer '+OBEDGO_CONFIG.supabaseKey,'Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());ok.style.display='block';ok.innerHTML='<b>Objednávka bola odoslaná ✓</b><br>'+name+'<br>'+s.value+'<br>'+m.value+'<br>'+p.value+' · 6,20 €';ok.scrollIntoView({behavior:'smooth'})}catch(e){err.style.display='block';err.textContent='Objednávku sa nepodarilo odoslať. Skús to znova.';console.error(e)}finally{btn.disabled=false;btn.textContent='OBJEDNAŤ OBED'}};</script></body></html>
