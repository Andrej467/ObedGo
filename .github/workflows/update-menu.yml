name: Update 4M weekly menu

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Run at both possible UTC equivalents of 17:00
    # in Slovakia; the time check below allows only the real 17:00 local run.
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'

permissions:
  contents: read

