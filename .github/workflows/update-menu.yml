name: Update 4M weekly menu

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-menu.yml'
      - 'scripts/update_menu.py'
  schedule:
    # GitHub cron is UTC. Multiple evening attempts make the import robust
    # to delayed Superobed publication and daylight-saving time changes.
    - cron: '0 15 * * 0-5'
    - cron: '0 16 * * 0-5'
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pymupdf
      - name: Update menu in Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TZ: Europe/Bratislava
        run: python scripts/update_menu.py
