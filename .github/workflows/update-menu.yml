name: Update 4M weekly menu

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These two runs guarantee one refresh at 06:45 local time
    # in Slovakia in both summer (CEST) and winter (CET).
    - cron: '45 4 * * 1-5'
    - cron: '45 5 * * 1-5'

permissions:
  contents: read

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: pip install requests beautifulsoup4 pymupdf

      - name: Import current 4M menu to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_menu.py
